name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and upload assets to
        required: true
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            args: ""
            rust-target: ""
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
            rust-target: ""

    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Install Rust
        if: matrix.rust-target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.rust-target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app
        run: cargo tauri build ${{ matrix.args }}

      - name: Generate checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib

          bundle_dir = pathlib.Path("src-tauri/target/release/bundle")
          suffixes = {
              ".AppImage",
              ".deb",
              ".dmg",
              ".exe",
              ".msi",
              ".rpm",
          }
          files = [
              path
              for path in bundle_dir.rglob("*")
              if path.is_file() and path.suffix in suffixes
          ]
          with open("SHA256SUMS-${{ matrix.name }}.txt", "w", encoding="utf-8") as out:
              for path in sorted(files):
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  out.write(f"{digest}  {path.name}\n")
          PY

      - name: Upload bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.rpm
            SHA256SUMS-${{ matrix.name }}.txt
