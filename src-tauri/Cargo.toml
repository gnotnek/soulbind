[package]
name = "soulbind"
version = "0.1.0"
description = "Cross-platform sound shortcut desktop app"
authors = ["SoulBind contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "soulbind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
rodio = "0.22.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
